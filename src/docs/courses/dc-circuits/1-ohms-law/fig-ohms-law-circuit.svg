<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 240"
  role="img"
  aria-labelledby="fig-title fig-desc"
>
  <title id="fig-title">
    Single-loop circuit with a voltage source and a resistor
  </title>
  <desc id="fig-desc">
    A voltage source V on the left drives a current I clockwise around a
    rectangular loop through a resistor R on the top wire.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor" />
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <!-- top wire, interrupted by the resistor -->
    <path d="M 80 60 H 240" />
    <path d="M 400 60 H 560" />
    <!-- right, bottom, and left wires; left wire gapped for the source plates -->
    <path d="M 560 60 V 180 H 80 V 130" />
    <path d="M 80 110 V 60" />
    <!-- resistor -->
    <rect x="240" y="45" width="160" height="30" fill="none" />
    <!-- source plates: long (+) and short (−) -->
    <path d="M 55 110 H 105" />
    <path d="M 68 130 H 92" stroke-width="5" />
    <!-- current arrow on the top wire -->
    <path d="M 470 40 H 420" marker-end="url(#arrow)" stroke-width="2" />
  </g>
  <g
    font-family="sans-serif"
    font-size="22"
    fill="currentColor"
    text-anchor="middle"
  >
    <text x="320" y="30">R</text>
    <text x="475" y="32">I</text>
    <text x="122" y="126">+</text>
    <text x="122" y="158">−</text>
    <text x="36" y="126">V</text>
  </g>
</svg>
